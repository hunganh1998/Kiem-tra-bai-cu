<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Kiểm Tra Bài Cũ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--ink:#1a1c2c;--pan:#29366f;--edge:#5d6dc4;--gold:#ffcd75;--grn:#38b764;--red:#b13e53;--org:#ef7d57;--sky:#a8e6ff;--pur:#7b4dab}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% -10%,#2a2d4a 0%,var(--ink) 65%);color:#f4f4f4;font:22px/1.25 VT323,'Courier New',monospace;display:flex;justify-content:center;overflow:hidden}
#w{width:min(100%,960px);height:100dvh;display:flex;flex-direction:column;padding:8px;gap:8px;overflow:hidden}
#st{flex:0 0 auto;position:relative;width:100%;max-width:calc(52dvh * 16 / 9);margin:0 auto;aspect-ratio:16/9;border:4px solid #000;box-shadow:0 0 0 4px var(--edge),0 8px 0 rgba(0,0,0,.35);background:#000;overflow:hidden}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated}
#mu{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding:0 10px;z-index:30;opacity:.9}
#pop{position:absolute;left:50%;top:40%;transform:translateX(-50%);font:44px 'Press Start 2P',monospace;color:#fff;text-shadow:3px 3px 0 #000;opacity:0;pointer-events:none;white-space:nowrap;z-index:4;letter-spacing:2px}
#pop.go{animation:pp 1.3s steps(10) forwards}
#pop.g{color:var(--gold)}#pop.r{color:var(--org)}
@keyframes pp{0%{opacity:1;top:60%;transform:translateX(-50%) scale(.6)}40%{transform:translateX(-50%) scale(1.15)}100%{opacity:0;top:18%;transform:translateX(-50%) scale(1)}}
#ui{flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:hidden;background:var(--pan);border:4px solid #000;box-shadow:inset 0 0 0 4px var(--edge),0 0 0 4px var(--ink);padding:16px;position:relative;border-radius:2px}

/* ============ PLAYING MODE (dedicated quiz screen) ============ */
body.playing #st{display:none}
body.playing #ui{
  border:none;box-shadow:none;border-radius:6px;
  background:linear-gradient(180deg,#1f2240 0%,#0a0c18 100%);
  padding:0;overflow:hidden;
  border:3px solid var(--edge);
}
body.playing #ui::before{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:.15;
  background-image:
    linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:20px 20px;
}

/* Buttons */
button{font:inherit;color:var(--ink);background:var(--gold);border:4px solid #000;box-shadow:inset -4px -4px 0 var(--org),4px 4px 0 #000;padding:6px 14px;cursor:pointer;text-transform:uppercase;transition:transform .06s;border-radius:2px}
button:hover{background:#fff;transform:translate(-1px,-1px)}
button:active{transform:translate(3px,3px);box-shadow:none}
button:disabled{cursor:default;transform:none;opacity:.7}

/* Menu headings */
h1{font-size:clamp(40px,9vw,72px);line-height:.95;color:var(--gold);text-shadow:4px 4px 0 var(--red),8px 8px 0 #000;margin:0 0 10px;text-align:center;letter-spacing:2px}
h2{margin:0 0 10px;color:var(--gold);font-size:30px}h3{margin:6px 0;color:var(--gold)}
.sub{font:10px 'Press Start 2P',monospace;text-align:center;color:var(--sky);margin:0 0 14px;letter-spacing:2px}
.bt{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:12px 0}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:10px}
.cd{background:var(--ink);border:4px solid var(--edge);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:.15s;border-radius:2px}
.cd:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 6px 0 rgba(0,0,0,.4)}
.cd em{color:var(--gold);font-style:normal}.cd i{color:var(--sky);font-style:normal}.cd.lk{opacity:.45;cursor:default}
.sm{margin-top:12px}.res{text-align:center}.big{font-size:56px;color:var(--gold);font-family:'Press Start 2P',monospace;letter-spacing:2px}.stars{font-size:46px;color:var(--gold)}.ac{color:var(--grn);margin:2px}
/* Level bar */
.lvwrap{display:flex;align-items:center;gap:10px;background:#0a0c18;border:3px solid var(--edge);padding:8px 12px;margin:8px 0;border-radius:2px}
.lv{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--gold)}
.lvbar{flex:1;height:16px;background:#000;border:3px solid #000;box-shadow:inset 0 0 0 2px var(--edge);position:relative;border-radius:2px;overflow:hidden}
.lvfill{height:100%;background:linear-gradient(90deg,var(--gold),var(--org));transition:width .5s}
.lvtxt{font-size:16px;color:var(--sky)}
.streak{display:inline-flex;align-items:center;gap:6px;background:#0a0c18;border:3px solid var(--org);padding:4px 10px;font-family:'Press Start 2P',monospace;font-size:11px;color:var(--org);border-radius:2px}

/* ============ QUESTION SCREEN ============ */
.qscreen{position:relative;display:flex;flex-direction:column;height:100%;padding:12px;gap:10px;z-index:1}

.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.qchap{color:var(--gold);font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:1px}
.qscore{color:var(--gold);font-family:'Press Start 2P',monospace;font-size:13px}
.qscore small{color:var(--sky);font-size:16px;font-family:VT323,monospace;margin-left:4px}
.qdots{display:flex;gap:4px}
.qdot{width:10px;height:10px;background:#000;border:2px solid var(--edge);border-radius:50%}
.qdot.done{background:var(--grn);border-color:#000}
.qdot.cur{background:var(--gold);border-color:#000;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.25)}}

/* Hero: avatar + speech bubble */
.qhero{display:flex;gap:10px;align-items:flex-start;flex:0 0 auto}
.qavatar{flex:0 0 auto;width:76px;height:76px;background:#0a0c18;border:3px solid var(--edge);border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:3px 3px 0 rgba(0,0,0,.5)}
.qavatar canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.qbubble{flex:1 1 auto;position:relative;background:#f4f4f4;color:var(--ink);border:3px solid #000;padding:10px 14px;border-radius:4px;font-size:clamp(17px,2.4vw,21px);line-height:1.25;box-shadow:4px 4px 0 rgba(0,0,0,.45);min-height:56px;max-height:24dvh;overflow-y:auto}
.qbubble::before{content:'';position:absolute;left:-11px;top:18px;width:0;height:0;border:8px solid transparent;border-right-color:#000}
.qbubble::after{content:'';position:absolute;left:-6px;top:19px;width:0;height:0;border:7px solid transparent;border-right-color:#f4f4f4}
.qtag{display:inline-block;background:var(--org);color:var(--ink);padding:1px 8px;margin-right:6px;font:11px 'Press Start 2P',monospace;vertical-align:2px;border-radius:2px}

/* Timer */
.qtimer{position:relative;height:24px;background:#000;border:3px solid #000;box-shadow:inset 0 0 0 2px var(--edge);border-radius:2px;overflow:hidden;flex:0 0 auto}
#bar{height:100%;background:linear-gradient(90deg,var(--grn),#5fd47e);width:100%;transition:width .12s linear}
#bar.lo{background:linear-gradient(90deg,var(--red),var(--org));animation:bl .5s steps(2) infinite}
@keyframes bl{50%{opacity:.5}}
.qtimer b{position:absolute;right:8px;top:3px;font:11px 'Press Start 2P',monospace;color:#fff;text-shadow:2px 2px 0 #000}

/* Answers */
.qopts{display:grid;grid-template-columns:1fr;gap:8px;flex:1 1 auto;min-height:0;align-content:start}
@media (min-width:560px){.qopts{grid-template-columns:1fr 1fr}}
.qopt{display:flex;align-items:center;gap:10px;background:#f4f4f4;color:var(--ink);border:3px solid #000;box-shadow:inset -3px -3px 0 #b9b9c9,3px 3px 0 #000;padding:8px 12px;text-align:left;cursor:pointer;font:inherit;text-transform:none;line-height:1.2;border-radius:2px;min-height:48px;transition:.06s}
.qopt:hover:not(:disabled){background:#fff;transform:translate(-1px,-1px)}
.qopt:active:not(:disabled){transform:translate(2px,2px);box-shadow:inset -1px -1px 0 #b9b9c9,1px 1px 0 #000}
.qopt b{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:var(--pan);color:var(--gold);border:2px solid #000;font:13px 'Press Start 2P',monospace;flex-shrink:0;border-radius:2px}
.qopt span{flex:1}
.qopt.ok{background:var(--grn);color:#fff}.qopt.ok b{background:#fff;color:var(--grn)}
.qopt.no{background:var(--red);color:#fff}.qopt.no b{background:#000;color:#fff}
.qopt:disabled{cursor:default}

/* Tools */
.qtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:0 0 auto}
.qtools button{font-size:15px;padding:4px 10px;box-shadow:inset -3px -3px 0 var(--org),3px 3px 0 #000}
#combo{background:var(--org);color:var(--ink);border:3px solid #000;padding:3px 8px;font:10px 'Press Start 2P',monospace;box-shadow:2px 2px 0 #000;display:none;border-radius:2px}
#combo.on{display:inline-block;animation:cmb .4s ease-out}
@keyframes cmb{0%{transform:scale(1.6) rotate(-6deg)}100%{transform:scale(1) rotate(0)}}

/* Feedback overlay */
.fb-overlay{position:absolute;inset:0;background:rgba(10,12,24,.97);display:none;flex-direction:column;justify-content:center;padding:20px;z-index:10;animation:fadeIn .22s ease-out;overflow-y:auto}
.fb-overlay.on{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fbinner{max-width:640px;margin:0 auto;width:100%;border:4px solid;padding:16px;border-radius:4px;background:#0a0c18}
.fbinner.g{border-color:var(--grn);box-shadow:0 0 0 4px rgba(56,183,100,.18)}
.fbinner.r{border-color:var(--red);box-shadow:0 0 0 4px rgba(177,62,83,.18)}
.fbinner h3{margin:0 0 8px;font-family:'Press Start 2P',monospace;font-size:14px;letter-spacing:1px}
.fbinner.g h3{color:var(--grn)}.fbinner.r h3{color:var(--org)}
.fbinner p{margin:8px 0;font-size:20px;line-height:1.3}
.fbinner small{display:block;color:var(--sky);margin:10px 0 14px;font-size:16px}
.fbinner .next-btn{width:100%;margin-top:8px;padding:12px;font-size:20px}
</style></head><body>

  <div id="ui"></div>
</div>

{"d":4,"t":"mc","sc":1,"b":1,"q":"FINAL CHALLENGE: Founder gọi vốn theo nhiều vòng (staging), cách nhau 12-18 tháng, gắn với các milestone. Nhận định nào đúng?","o":["Loại bỏ rủi ro tái tài trợ vì vốn luôn được cam kết trước đó","Làm tăng pha loãng và chi phí gọi vốn so với một vòng lớn duy nhất","Chỉ có lợi cho founder, nhà đầu tư không có lợi ích nào thêm","Giảm chi phí gọi vốn và pha loãng, nhưng tạo rủi ro tái tài trợ"],"a":3,"e":"Với founder, staging giảm chi phí gọi vốn và pha loãng nhưng có refinancing risk; với nhà đầu tư, staging tạo option value chờ đợi và tăng kiểm soát nhờ power of the purse.","s":"Lecture 1 · Slide 37"}]},
{"title":"Evaluating Venture Opportunities (VEM)","qs":[
{"d":1,"t":"mc","q":"Venture Evaluation Matrix (VEM) gồm bao nhiêu ô (cell) chính?","o":["9","6","12","3"],"a":0,"e":"VEM có 3 hàng (Value Proposition, Industry, Strategy) × 3 cột (Customer, Company, Entrepreneur) = 9 ô.","s":"Lecture 2 · Slide 4, 14"},
{"d":1,"t":"tf","q":"Đúng hay Sai: Hàng Strategy của VEM mang góc nhìn động (dynamic), xem công ty định hình và nắm bắt giá trị thế nào.","a":0,"e":"Đúng. Value Proposition là góc nhìn micro, Industry là macro, Strategy là dynamic.","s":"Lecture 2 · Slide 15"},
{"d":2,"t":"mc","q":"Ô Network nằm ở vị trí nào trong VEM?","o":["Hàng Industry, cột Entrepreneur","Hàng Strategy, cột Entrepreneur","Hàng Strategy, cột Customer","Hàng Value Proposition, cột Company"],"a":0,"e":"Hàng Industry gồm Market (Customer), Competition (Company), Network (Entrepreneur).","s":"Lecture 2 · Slide 22"},
{"d":3,"t":"mc","sc":1,"q":"Nhóm sáng lập có công nghệ rất ấn tượng nhưng chưa hề kiểm tra xem khách hàng có thực sự cần nó không. Họ mắc lỗi phổ biến nào và cần quay lại ô nào của VEM?","o":["Quy trình sản xuất chưa đủ khả năng mở rộng (ô Production)","Tập trung vào giải pháp trước khi hiểu nhu cầu thật (ô Need)","Định giá sản phẩm quá thấp so với các đối thủ (ô Sales)","Thiếu mạng lưới cố vấn và nhà đầu tư cũ (ô Network)"],"a":1,"e":"Không có nhu cầu khách hàng thật thì không có cơ hội kinh doanh. Cần kiểm tra Need: nhu cầu là must-have hay nice-to-have, khách sẵn sàng trả bao nhiêu.","s":"Lecture 2 · Slide 17"},
{"d":1,"t":"mc","q":"Ba hàng (perspectives) của VEM là gì?","o":["Solution, Competition, Production (các ô thuộc cột Company)","Value Proposition, Industry, Strategy (ba hàng của ma trận)","Customer, Company, Entrepreneur (ba cột của ma trận)","Need, Market, Sales (các ô thuộc cột Customer của ma trận)"],"a":1,"e":"Ba hàng: Value Proposition (micro), Industry (macro), Strategy (dynamic).","s":"Lecture 2 · Slide 15"},
{"d":1,"t":"mc","q":"Cột nào của VEM tập trung vào đội ngũ, mạng lưới và tổ chức?","o":["Industry","Customer","Company","Entrepreneur"],"a":3,"e":"Cột Entrepreneur gồm Team, Network, Organization.","s":"Lecture 2 · Slide 15"},
{"d":2,"t":"mc","q":"Ô nào của VEM trả lời: công ty tiếp cận khách hàng, phân phối và định giá như thế nào?","o":["Sales","Market","Need","Production"],"a":0,"e":"Ô 3.1 Sales: kênh tiếp cận, chiến lược phân phối, mô hình doanh thu và định giá.","s":"Lecture 2 · Slide 29"},
{"d":2,"t":"mc","q":"Hàng Value Proposition (góc nhìn micro) giúp kết luận điều gì về cơ hội?","o":["Quy mô tiềm năng, tức khả năng mở rộng ra thị trường lớn hơn","Giá trị tiềm năng, tức khả năng tạo ra giá trị","Mức độ rủi ro pháp lý của ngành mà công ty hoạt động","Khả năng tăng trưởng và nắm bắt giá trị trong dài hạn"],"a":1,"e":"Value Proposition: giá trị tiềm năng; Industry: quy mô tiềm năng; Strategy: tiềm năng tăng trưởng.","s":"Lecture 2 · Slide 35"},
{"d":2,"t":"tf","q":"Đúng hay Sai: Theo bài giảng, các nhà đầu tư thường xếp đội ngũ sáng lập là một trong những yếu tố quan trọng nhất khi lựa chọn dự án.","a":0,"e":"Đúng. Chất lượng đội ngũ là then chốt cho thực thi; nhà đầu tư thường xếp team là yếu tố quan trọng nhất trong lựa chọn.","s":"Lecture 2 · Slide 21"},
{"d":3,"t":"mc","q":"Câu hỏi nào dưới đây thuộc về ô Market (khách hàng, hàng Industry)?","o":["Chiến lược tuyển dụng, phát triển và giữ chân nhân tài ra sao?","Ai là đối thủ trực tiếp và gián tiếp, họ mạnh yếu ở những điểm nào?","Nhóm sáng lập có đủ kỹ năng, kinh nghiệm cần thiết để thực thi không?","Phân khúc mục tiêu lớn cỡ nào, tăng nhanh ra sao, được chấp nhận thế nào?"],"a":3,"e":"Market: quy mô phân khúc, tốc độ tăng trưởng, quá trình chấp nhận. Các câu còn lại thuộc Competition, Team, Organization.","s":"Lecture 2 · Slide 23"},
{"d":3,"t":"mc","sc":1,"q":"Nhà đầu tư muốn hiểu vị thế cạnh tranh tương đối của venture. Bài giảng gắn công cụ nào với ô Competition để có cái nhìn đa chiều?","o":["Mô hình DCF của đối thủ niêm yết","SWOT của các đối thủ chính","Điều khoản term sheet của vòng trước","Bảng cân đối kế toán dự phóng"],"a":1,"e":"SWOT cho các đối thủ chính cho cái nhìn đa chiều về vị thế cạnh tranh của venture.","s":"Lecture 2 · Slide 25"},
{"d":3,"t":"mc","q":"Lợi thế cạnh tranh 'Customer access' bắt nguồn từ đâu và dựa trên động lực nào?","o":["Cột Entrepreneur (Team, Network, Organization); năng lực lãnh đạo","Cột Customer (Need, Market, Sales); lòng trung thành của khách hàng","Cột Company (Solution, Competition, Production); sở hữu trí tuệ độc quyền","Hàng Strategy (Sales, Production, Organization); kỷ luật kiểm soát chi phí"],"a":1,"e":"Customer access đến từ cột Customer, nền tảng là lòng trung thành khách hàng, thường xây bằng lợi thế đi đầu và uy tín.","s":"Lecture 2 · Slide 36"},
{"d":3,"t":"mc","sc":1,"q":"Một startup có đội ngũ giàu kinh nghiệm, gắn kết, mạng lưới ngành mạnh và văn hóa tổ chức tích cực. Điểm mạnh này phản ánh lợi thế nào?","o":["First-mover advantage (lợi thế đi đầu)","Customer access (tiếp cận khách hàng)","Entry barriers (rào cản gia nhập)","Competencies (năng lực cốt lõi)"],"a":3,"e":"Competencies đến từ cột Entrepreneur: team, network, organization; phụ thuộc vào lãnh đạo và khả năng tuyển dụng, giữ chân nhân tài.","s":"Lecture 2 · Slide 38"},
{"d":2,"t":"mc","q":"Khi viết business plan từ VEM, Executive Summary thể hiện nội dung gì?","o":["Tóm tắt các ô, hàng và cột của VEM","Chỉ riêng các dự phóng tài chính ba năm","Kế hoạch thoái vốn bằng cách niêm yết","Danh sách điều khoản trong bản term sheet"],"a":0,"e":"Executive Summary tóm tắt các ô, hàng, cột của VEM; các mục còn lại tương ứng từng ô cụ thể.","s":"Lecture 2 · Slide 40"},
{"d":3,"t":"mc","q":"VEM Spreadsheet Tool giúp nhà đầu tư làm gì ở bước sàng lọc ban đầu?","o":["Chấm điểm từng ô VEM để ưu tiên dự án đáng xem xét tiếp","Tự động định giá doanh nghiệp bằng phương pháp DCF","Soạn sẵn term sheet và hợp đồng đầu tư cho vòng gọi vốn","Dự báo doanh thu của venture theo cách tiếp cận top-down"],"a":0,"e":"Nhà đầu tư gán điểm cho mỗi ô VEM để nhanh chóng loại bỏ dự án không đáng thời gian và ưu tiên dự án triển vọng.","s":"Lecture 2 · Slide 41"},
{"d":3,"t":"mc","q":"Trong due diligence, hoạt động nào gắn với cột Entrepreneur (Team, Network, Organization)?","o":["Đánh giá công nghệ, phân tích đối thủ và thăm cơ sở sản xuất","Nghiên cứu thị trường sơ cấp, thứ cấp và theo dõi tỷ lệ chấp nhận","Rà soát hợp đồng pháp lý của các cổ đông ở các vòng trước","Gặp nhóm sáng lập, tiếp xúc mạng lưới và quan sát các buổi thảo luận"],"a":3,"e":"Customer/Market: nghiên cứu thị trường; Company: công nghệ, đối thủ, thăm cơ sở; Entrepreneur: gặp team, mạng lưới, quan sát thảo luận.","s":"Lecture 2 · Slide 42"},
{"d":2,"t":"tf","q":"Đúng hay Sai: VEM trả lời mọi câu hỏi của nhà đầu tư, kể cả định giá và cấu trúc deal.","a":1,"e":"Sai. VEM dẫn dắt quyết định nhưng không giải quyết hết; nhà đầu tư còn xét sức hấp dẫn tài chính của deal (định giá, cấu trúc, thời điểm, mức tương thích).","s":"Lecture 2 · Slide 42"},
{"d":4,"t":"mc","sc":1,"b":1,"q":"FINAL CHALLENGE: Nhà đầu tư thấy ngành lớn và tăng nhanh, nhưng đối thủ dễ sao chép: không có IP, công nghệ độc quyền hay quy trình sản xuất khác biệt. Lợi thế cạnh tranh nào đang yếu?","o":["Customer access, thuộc cột Customer (Need, Market, Sales)","Entry barriers, thuộc cột Company (Solution, Competition, Production)","Competencies, thuộc cột Entrepreneur (Team, Network, Organization)","Không lợi thế nào yếu vì ngành vừa lớn vừa tăng trưởng nhanh"],"a":1,"e":"Entry barriers đến từ cột Company: IP, công nghệ độc quyền, quy mô, quy trình sản xuất phức tạp.","s":"Lecture 2 · Slide 37"}]},
{"title":"The Financial Plan","qs":[
{"d":1,"t":"mc","q":"Hai cách tiếp cận chính để ước tính doanh thu là gì?","o":["Pro forma và Actual","Cost-plus và Value-based","CapEx và OpEx","Top-down và Bottom-up"],"a":3,"e":"Top-down xuất phát từ phân tích thị trường; Bottom-up xuất phát từ năng lực vận hành và các động lực doanh thu.","s":"Lecture 3 · Slide 14"},
{"d":1,"t":"mc","q":"Phương trình cơ bản của Balance Sheet là gì?","o":["Assets = Liabilities + Equity","Equity = Assets + Liabilities","Assets = Revenue − COGS","Liabilities = Assets + Equity"],"a":0,"e":"Balance Sheet là ảnh chụp tình hình tài chính tại một thời điểm và luôn cân bằng theo Assets = Liabilities + Equity.","s":"Lecture 3 · Slide 29"},
{"d":2,"t":"mc","q":"Theo bài giảng, thời điểm thích hợp để bắt đầu gọi vốn là khi nào?","o":["Ngay tại thời điểm hoàn tất bản mô tả ý tưởng kinh doanh","Ngay khi số dư tiền mặt của công ty về đến mức bằng 0","Khoảng 1 năm trước khi nhu cầu vốn đầu tiên xuất hiện","Sau khi công ty đạt điểm hòa vốn đầu tiên trong hoạt động"],"a":2,"e":"Gọi vốn cần thời gian, nên phải bắt đầu trước khi cạn tiền để không rơi vào khủng hoảng.","s":"Lecture 3 · Slide 39"},
{"d":3,"t":"mc","sc":1,"q":"Shop thương mại điện tử dự báo bottom-up: 10.000 lượt truy cập/tháng, tỷ lệ chuyển đổi 2%, giá trị đơn hàng trung bình 50 USD. Doanh thu tháng dự báo?","o":["1.000 USD","100.000 USD","10.000 USD","5.000 USD"],"a":2,"e":"Doanh thu = Visitors × Conversion Rate × AOV = 10.000 × 2% × 50 = 10.000 USD.","s":"Lecture 3 · Slide 17"},
{"d":1,"t":"tf","q":"Đúng hay Sai: 'Pro forma' có nghĩa là số liệu dự báo hoặc dự phóng.","a":0,"e":"Đúng. Pro forma là các báo cáo dự phóng, tức là ước tính tốt nhất về kết quả và vị thế tài chính tương lai.","s":"Lecture 3 · Slide 29"},
{"d":1,"t":"mc","q":"Công thức tính lợi nhuận trong Income Statement theo bài giảng?","o":["Beginning Cash + Cash In − Cash Out = Ending Cash","Assets = Liabilities + Equity","Revenue − COGS − Operating Expenses = Net Income","CFO + CFI + CFF = Net Change in Cash"],"a":2,"e":"Income Statement cho thấy khả năng sinh lời trong một kỳ; các công thức còn lại thuộc Cash Flow và Balance Sheet.","s":"Lecture 3 · Slide 29"},
{"d":2,"t":"mc","q":"Milestone được định nghĩa đúng nhất là gì?","o":["Chỉ tiêu doanh thu cố định được lặp lại vào cuối mỗi quý tài chính","Báo cáo kiểm toán được lập cuối năm để gửi cho cơ quan thuế","Thành tựu đo lường được, giảm rủi ro và mở khóa giai đoạn chi tiêu kế tiếp","Ngày đáo hạn của khoản vay đầu tiên mà công ty ký với ngân hàng"],"a":2,"e":"Milestone là sự kiện nổi bật, đo lường được, thể hiện tiến bộ và gắn với mục tiêu gọi vốn.","s":"Lecture 3 · Slide 10"},
{"d":2,"t":"mc","q":"Khi nào phương pháp top-down kém thuyết phục?","o":["Khi thị trường mục tiêu quá lớn hoặc chưa tồn tại","Khi công ty đã có dữ liệu bán hàng lịch sử đầy đủ và đáng tin","Khi thị phần mục tiêu đã được xác định và ước lượng tốt từ trước","Khi chi phí biến đổi của công ty thấp hơn chi phí cố định"],"a":0,"e":"Ví dụ 'nhà hàng ở New York' (quá lớn) hoặc 'chuyến bay vũ trụ' (thị trường chưa có).","s":"Lecture 3 · Slide 16"},
{"d":3,"t":"mc","sc":1,"q":"SaaS dự kiến 200 người đăng ký mới mỗi tháng, phí 9,99 USD/tháng. Doanh thu của nhóm mới trong tháng xấp xỉ?","o":["199,8 USD","19.980 USD","23.976 USD","1.998 USD"],"a":3,"e":"SaaS: New Subscribers × Subscription Price = 200 × 9,99 ≈ 1.998 USD.","s":"Lecture 3 · Slide 17"},
{"d":3,"t":"mc","sc":1,"q":"Công ty B2B có 4 sales rep, mỗi người chốt 6 deal mỗi quý, giá trị deal trung bình 25.000 USD. Doanh thu theo quý?","o":["600.000 USD","150.000 USD","100.000 USD","2.400.000 USD"],"a":0,"e":"B2B: (# Sales Reps) × (# deals/rep) × (Avg. Deal Size) = 4 × 6 × 25.000 = 600.000 USD.","s":"Lecture 3 · Slide 17"},
{"d":2,"t":"mc","q":"Spotify chọn một mức phí cố định 9,99 USD/tháng cho truy cập không giới hạn. Đây là chiến lược định giá nào?","o":["Value-based pricing","Competitor-based pricing","Định giá theo chi phí biên","Cost-plus pricing"],"a":0,"e":"Giá dựa trên giá trị cảm nhận của khách hàng ('all the music in the world'); khó nhất nhưng lợi nhuận cao nhất.","s":"Lecture 3 · Slide 19"},
{"d":3,"t":"mc","q":"Khoản chi nào được xếp vào startup cost (CapEx) thay vì operating cost (OpEx)?","o":["Mua xe bán hàng và laptop cho đội ngũ ban đầu","Lương cố định của nhân viên kinh doanh","Tiền thuê văn phòng được trả hằng tháng","Ngân sách quảng cáo trên mạng xã hội hằng tháng"],"a":0,"e":"CapEx là chi phí một lần để khởi động, được vốn hóa và khấu hao; OpEx là chi phí lặp lại ghi nhận trên Income Statement.","s":"Lecture 3 · Slide 23, 32"},
{"d":3,"t":"mc","q":"Cash Flow from Operations được tính bắt đầu từ đâu?","o":["Bắt đầu từ tổng tài sản, trừ nợ phải trả và vốn chủ sở hữu","Bắt đầu từ EBITDA, trừ toàn bộ nợ dài hạn sắp đến hạn thanh toán","Bắt đầu từ Net Income, cộng chi phí phi tiền mặt, điều chỉnh vốn lưu động","Bắt đầu từ Revenue, trừ CapEx và cộng tiền huy động vốn cổ phần của kỳ"],"a":2,"e":"CFO: Net Income + khấu hao (phi tiền mặt) ± thay đổi vốn lưu động.","s":"Lecture 3 · Slide 32"},
{"d":3,"t":"mc","sc":1,"q":"CFO = −300, CFI = −150, CFF = +700, tiền đầu kỳ 100 (nghìn USD). Tiền cuối kỳ?","o":["250","−350","350","1.250"],"a":2,"e":"Net change = −300 − 150 + 700 = 250; Ending = 100 + 250 = 350.","s":"Lecture 3 · Slide 32"},
{"d":3,"t":"mc","q":"Tài sản ngắn hạn CA = 500, nợ ngắn hạn CL = 320. Net Working Capital là bao nhiêu?","o":["−180","320","180","820"],"a":2,"e":"NWC = CA − CL = 500 − 320 = 180.","s":"Lecture 3 · Slide 34"},
{"d":2,"t":"mc","q":"Theo hướng dẫn xây mô hình, báo cáo nào được lập cuối cùng để làm 'check figure'?","o":["Balance Sheet","Statement of Cash Flows","Tab giả định (Assumptions)","Income Statement"],"a":0,"e":"Balance Sheet lập sau cùng: nếu Assets = Liabilities + Equity thì mô hình cân bằng và nhiều khả năng đúng.","s":"Lecture 3 · Slide 35"},
{"d":2,"t":"mc","q":"Sunk cost fallacy khiến nhà đầu tư hành xử thế nào?","o":["Định giá quá thấp những công ty mới thành lập chưa có lịch sử","Từ chối mọi venture có dự báo tăng trưởng nhanh về doanh thu","Chỉ đầu tư vào những venture do người quen giới thiệu trực tiếp","Tiếp tục rót vốn vào venture đang yếu chỉ vì đã đầu tư trước đó"],"a":3,"e":"Kahneman: sunk cost fallacy khiến nhà đầu tư tiếp tục rót tiền vào venture ốm yếu chỉ vì đã bỏ tiền.","s":"Lecture 3 · Slide 43"},
{"d":2,"t":"mc","q":"Phần 'Use of Funds' trong pitch nên trình bày thế nào?","o":["Biểu đồ tròn cho thấy tiền sẽ được chi vào các hạng mục nào","Danh sách chi tiết các khoản lương đã trả cho nhà sáng lập","Dự báo giá cổ phiếu của công ty sau khi niêm yết","Bảng so sánh lãi suất tiền gửi giữa các ngân hàng thương mại"],"a":0,"e":"Ví dụ: 40% Product Dev, 40% Sales & Marketing, 20% G&A.","s":"Lecture 3 · Slide 42"},
{"d":1,"t":"tf","q":"Đúng hay Sai: Dự báo tài chính của venture thường quá bi quan và hiếm khi bị lỗi thời.","a":1,"e":"Sai. Dự báo luôn không chính xác, nhanh lỗi thời và luôn lạc quan.","s":"Lecture 3 · Slide 7"},
{"d":4,"t":"mc","sc":1,"b":1,"q":"FINAL CHALLENGE: Báo cáo lưu chuyển tiền tệ dự phóng (giả định không huy động thêm vốn) cho thấy số dư tiền thấp nhất là −1,2 triệu USD ở năm thứ 3. Founder nên hiểu thế nào?","o":["Chỉ cần vay bạn bè và gia đình 1,2 triệu USD là đủ giải quyết","Tổng nhu cầu vốn xấp xỉ 1,2 triệu USD, nên gọi vốn sớm 1 năm trước","Công ty chắc chắn sẽ phá sản vào năm thứ ba của giai đoạn dự báo","Cần gọi 1,2 triệu USD mỗi năm trong ba năm liên tiếp nhau"],"a":1,"e":"Điểm âm thấp nhất của số dư tiền chính là tổng nhu cầu vốn; nên gọi vốn trước khoảng 1 năm so với lúc nhu cầu xuất hiện.","s":"Lecture 3 · Slide 39"}]},
{"title":"Valuation Methods","qs":[
{"d":1,"t":"mc","q":"Pre-money valuation là gì?","o":["Định giá công ty trước khi nhận khoản đầu tư","Định giá công ty ngay sau khi nhận khoản đầu tư","Số tiền mà nhà đầu tư mới cam kết rót vào công ty","Giá trị công ty tại thời điểm niêm yết lần đầu"],"a":0,"e":"Pre-money là định giá trước đầu tư, post-money là sau đầu tư (post = pre + I).","s":"Lecture 4 · Slide 8"},
{"d":2,"t":"tf","q":"Đúng hay Sai: Ở vòng đầu, số cổ phiếu ban đầu chỉ là hệ số quy mô (scaling factor): nó đổi giá mỗi cổ phiếu nhưng không đổi tỷ lệ sở hữu cuối cùng.","a":0,"e":"Đúng. Tỷ lệ sở hữu do số tiền đầu tư và định giá quyết định, không do số cổ phiếu.","s":"Lecture 4 · Slide 12"},
{"d":3,"t":"mc","q":"Nhà đầu tư rót 2 triệu USD để nhận 25% công ty. Post-money và pre-money valuation là?","o":["Post 8 triệu; Pre 6 triệu","Post 6 triệu; Pre 8 triệu","Post 8 triệu; Pre 10 triệu","Post 2 triệu; Pre 6 triệu"],"a":0,"e":"V_POST = I / F_INV = 2 / 25% = 8 triệu; V_PRE = V_POST − I = 6 triệu.","s":"Lecture 4 · Slide 10-11"},
{"d":3,"t":"mc","sc":1,"q":"VitaPitch có FCF (nghìn USD) năm 1-4 lần lượt: −500; 0; 800; 1.200, tỷ suất yêu cầu 22%. Cần đầu tư 700K. Kết luận theo DCF?","o":["DCF ≈ 700K nên chỉ vừa đủ để hòa vốn","DCF ≈ 1.500K nên rất đáng đầu tư ngay","DCF ≈ 572K > 700K nên hoàn toàn đáng đầu tư","DCF ≈ 572K < 700K nên chưa đáng đầu tư"],"a":3,"e":"−500/1,22 + 800/1,22³ + 1.200/1,22⁴ ≈ −409,8 + 440,6 + 541,7 ≈ 572K < 700K.","s":"Lecture 4 · Slide 45"},
{"d":1,"t":"mc","q":"Định giá (valuation) quyết định điều gì?","o":["Số lượng nhân viên cần tuyển trong vòng gọi vốn kế tiếp","Mức lãi suất ngân hàng áp dụng cho khoản vay của công ty","Thời điểm công ty đủ điều kiện để niêm yết trên sàn","Tỷ lệ vốn chủ sở hữu nhà đầu tư nhận và kỳ vọng lợi suất của họ"],"a":3,"e":"Valuation xác định % vốn chủ sở hữu mà nhà đầu tư nhận và cho phép ước tính lợi suất kỳ vọng.","s":"Lecture 4 · Slide 7"},
{"d":1,"t":"tf","q":"Đúng hay Sai: Giá trị phần sở hữu của nhà đầu tư ở công ty chưa niêm yết chỉ là 'paper money' vì chưa có thị trường cho cổ phiếu.","a":0,"e":"Đúng. Giá trị này mang tính giả định cho đến khi có thị trường hoặc sự kiện thoái vốn.","s":"Lecture 4 · Slide 6"},
{"d":2,"t":"mc","q":"Công thức nào đúng cho post-money valuation?","o":["V_POST = V_PRE × F_INV","V_POST = V_PRE + I","V_POST = V_PRE ÷ I","V_POST = V_PRE − I"],"a":1,"e":"Post-money là định giá sau khi nhận đầu tư nên bằng pre-money cộng khoản đầu tư.","s":"Lecture 4 · Slide 8, 10"},
{"d":3,"t":"mc","sc":1,"q":"Founder sở hữu 100% công ty có pre-money 3 triệu USD. Nhà đầu tư rót 1 triệu USD. Sau vòng này, tỷ lệ của nhà đầu tư và founder?","o":["20% và 80%","30% và 70%","33,3% và 66,7%","25% và 75%"],"a":3,"e":"V_POST = 3 + 1 = 4 triệu; F_INV = 1/4 = 25%; F_PRE = 75%.","s":"Lecture 4 · Slide 10, 17"},
{"d":4,"t":"mc","sc":1,"q":"Vòng 1: nhà đầu tư A sở hữu 20%. Vòng 2: nhà đầu tư mới nhận 25% công ty sau vòng. Nếu A không mua thêm, A còn bao nhiêu sau vòng 2?","o":["20%","5%","17,5%","15%"],"a":3,"e":"Pha loãng: F1(2) = 20% × (1 − 25%) = 15%.","s":"Lecture 4 · Slide 18-20"},
{"d":3,"t":"mc","q":"Chọn ít cổ phiếu ban đầu để giá mỗi cổ phiếu cao có làm tăng tỷ lệ sở hữu của founder không?","o":["Có, vì pre-money tăng tỷ lệ thuận với giá mỗi cổ phiếu được định ra","Chỉ có khi nhà đầu tư là một quỹ VC chuyên nghiệp trong ngành","Có, vì giá cao nên nhà đầu tư mua ít cổ phiếu hơn và founder giữ nhiều hơn","Không, vì số cổ phiếu chỉ là hệ số quy mô, tỷ lệ do I và định giá quyết định"],"a":3,"e":"Số cổ phiếu là numéraire: đổi giá mỗi cổ phiếu nhưng không đổi tỷ lệ sở hữu cuối cùng của các bên.","s":"Lecture 4 · Slide 12-14"},
{"d":2,"t":"mc","q":"Bốn đầu vào cần ước tính trong Venture Capital Method?","o":["V_PRE, V_POST, S_PRE, S_INV (định giá và số cổ phiếu hai bên)","I, FCF, g, WACC (đầu tư, dòng tiền, tăng trưởng, chi phí vốn bình quân)","CCM, z, r, R (bội số tiền, tỷ lệ thất bại, vòng hiện tại, vòng thoái vốn)","I, T, Xe, ρ (đầu tư, thời gian thoái vốn, giá trị thoái vốn, tỷ suất yêu cầu)"],"a":3,"e":"VCM cần: Investment amount I, Time-to-exit T, Exit value Xe, Hurdle rate ρ.","s":"Lecture 4 · Slide 29"},
{"d":3,"t":"mc","q":"Ở Mỹ, thời gian trung bình từ vòng tài trợ đầu tiên đến IPO là bao lâu?","o":["6,3 năm","10,5 năm","3,2 năm","5,6 năm"],"a":0,"e":"Trung bình tới IPO là 6,3 năm; tới khi bị mua lại là 5,6 năm (Instagram 16 tháng, YouTube 18 tháng).","s":"Lecture 4 · Slide 32"},
{"d":3,"t":"mc","q":"Vì sao VC dùng tỷ suất yêu cầu (hurdle rate) rất cao khi định giá startup?","o":["Bù cho tỷ lệ thất bại cao, tỷ suất điều chỉnh theo xác suất thành công","Vì VC phải trả lãi suất rất cao cho LPs hằng năm theo hợp đồng quỹ","Vì startup thường có dòng tiền dương ổn định ngay từ những năm đầu hoạt động","Vì thuế đánh trên lợi nhuận của VC cao hơn so với doanh nghiệp thông thường"],"a":0,"e":"VC đối mặt tỷ lệ thất bại cao nên discount rate được điều chỉnh theo xác suất thành công/thất bại (z).","s":"Lecture 4 · Slide 34-38"},
{"d":4,"t":"mc","sc":1,"q":"VC dùng CCM thay cho ρ, biết CCM = (1+ρ)^T. Với ρ = 50%/năm, T = 2 năm, CCM là?","o":["3,00x","1,50x","2,25x","1,25x"],"a":2,"e":"CCM = (1 + 50%)² = 2,25.","s":"Lecture 4 · Slide 39"},
{"d":3,"t":"mc","q":"Khi nào DCF phù hợp hơn với một venture?","o":["Ở giai đoạn muộn, khi đã có thông tin lịch sử về công ty","Khi công ty chưa tạo ra bất kỳ dòng tiền nào để dự báo","Ở giai đoạn ý tưởng, khi chưa có doanh thu hay khách hàng","Khi nhà đầu tư chỉ có thông tin về các đối thủ cạnh tranh"],"a":0,"e":"DCF khó áp dụng với venture vì bất định, trừ giai đoạn sau khi có thông tin lịch sử.","s":"Lecture 4 · Slide 42"},
{"d":3,"t":"mc","q":"Exit Comparables khác Investment Comparables ở điểm nào?","o":["Chỉ dùng mô hình chiết khấu dòng tiền cho từng công ty mẫu","Nhìn cách thị trường định giá các công ty trưởng thành tương đương","So sánh với các deal đầu tư tư nhân tương tự đã được thực hiện","Không cần chọn chỉ số so sánh hay tập công ty tham chiếu"],"a":1,"e":"Exit Comparables: tham chiếu thị trường công khai; Investment Comparables: các deal tư nhân. Cần chọn tập công ty và chỉ số.","s":"Lecture 4 · Slide 49-50, 55"},
{"d":4,"t":"mc","q":"Ba lưu ý (caveats) khi dùng multiples?","o":["Dùng multiple doanh thu cho mọi ngành, bỏ qua rủi ro, tránh so sánh chéo","Chỉ so sánh với công ty cùng quốc gia, cùng quy mô, cùng năm thành lập","Đo nhất quán, xem cả phân phối chứ không chỉ trung bình, coi chừng hiệu ứng bầy đàn","Chọn multiple cao nhất, loại bỏ công ty đang lỗ, lấy trung bình đơn giản"],"a":2,"e":"Multiples phải đo nhất quán, xét toàn bộ phân phối và thừa nhận chúng phản ánh định giá thị trường nên dễ chịu herding.","s":"Lecture 4 · Slide 54"},
{"d":3,"t":"mc","q":"Multiple dựa trên doanh thu hữu ích trong trường hợp nào?","o":["Khi muốn tính chính xác giá trị tài sản ròng hiện tại","Khi công ty có dòng tiền âm nhưng vẫn có doanh thu","Khi lợi nhuận ổn định và luôn dương qua nhiều năm","Khi công ty chưa có bất kỳ khoản doanh thu nào"],"a":1,"e":"Earnings có thể âm hoặc biến động; revenues dùng được cả khi dòng tiền âm.","s":"Lecture 4 · Slide 53"},
{"d":4,"t":"mc","sc":1,"b":1,"q":"FINAL CHALLENGE: Theo Venture Capital Method, VC kỳ vọng exit value 30 triệu USD sau 5 năm, hurdle rate 40%/năm, và rót 1,5 triệu USD. Tỷ lệ sở hữu VC cần nhận xấp xỉ?","o":["50,0%","5,0%","20,0%","26,9%"],"a":3,"e":"V_POST = Xe/(1+ρ)^T = 30/1,4⁵ ≈ 5,58 triệu. F_INV = I/V_POST = 1,5/5,58 ≈ 26,9%.","s":"Lecture 4 · Slide 27, 29, 39"}]},
{"title":"Sources of Financing","qs":[
{"d":1,"t":"mc","q":"Bootstrapping là gì?","o":["Niêm yết cổ phiếu trên sàn chứng khoán để huy động vốn từ công chúng","Xây dựng doanh nghiệp từ nguồn lực của chủ sở hữu, rất ít vốn ngoài","Bán cổ phần cho quỹ VC để lấy vốn trong vòng gọi vốn Series A","Vay một khoản lớn từ ngân hàng để tăng tốc mở rộng quy mô sản xuất"],"a":1,"e":"Chủ doanh nghiệp dùng nguồn lực của mình, không chia sẻ cổ phần hay vay khoản lớn.","s":"Lecture 5 · Slide 10"},
{"d":1,"t":"mc","q":"Vì sao ngân hàng thương mại thường ngại cho startup giai đoạn đầu vay?","o":["Ngân hàng chỉ được cho vay các công ty đã niêm yết trên sàn","Chưa có mô hình ổn định, ít tài sản thế chấp, dòng tiền bất ổn","Startup luôn chỉ muốn huy động vốn cổ phần và không muốn vay","Startup thường có lịch sử hoạt động dài nhưng doanh thu giảm liên tục"],"a":1,"e":"Startup thiếu lịch sử hoạt động, hiếm tài sản thế chấp, dòng tiền không ổn định và rủi ro vỡ nợ cao.","s":"Lecture 5 · Slide 20"},
{"d":2,"t":"mc","q":"Limited Partners (LPs) trong hệ sinh thái VC là ai?","o":["Nhà đầu tư tổ chức cấp vốn cho quỹ, không tham gia quản lý","Các nhà quản lý quỹ đưa ra quyết định đầu tư vào các startup","Những công ty khởi nghiệp đang nằm trong danh mục đầu tư của quỹ","Các founder cần vốn và chuyên môn để mở rộng quy mô doanh nghiệp"],"a":0,"e":"LPs (quỹ hưu trí, quỹ đại học, bảo hiểm...) là nguồn vốn thật sự nhưng không có tiếng nói trong quản lý; GPs mới quản lý quỹ.","s":"Lecture 5 · Slide 25"},
{"d":3,"t":"mc","sc":1,"q":"Quỹ VC huy động 100 triệu USD vốn cam kết từ LPs. Phí quản lý thường 2%/năm. Mỗi năm LPs trả phí quản lý khoảng bao nhiêu?","o":["0,2 triệu USD","2 triệu USD","5 triệu USD","20 triệu USD"],"a":1,"e":"Management fee thường 2% vốn cam kết mỗi năm: 100 triệu × 2% = 2 triệu USD.","s":"Lecture 5 · Slide 27"},
{"d":1,"t":"mc","q":"Ba giai đoạn của bootstrapping theo đúng thứ tự?","o":["Customer-funded → Beginner → Credit","Beginner → Customer-funded → Credit","Beginner → Credit → Customer-funded","Credit → Beginner → Customer-funded"],"a":1,"e":"Beginner (tiền tiết kiệm, bạn bè), Customer-funded (tiền từ khách hàng), Credit (vay hoặc tìm VC để mở rộng).","s":"Lecture 5 · Slide 11"},
{"d":2,"t":"mc","q":"Vì sao bạn bè và gia đình đầu tư vào startup?","o":["Họ muốn nhận cổ tức đều đặn mỗi năm từ doanh thu công ty","Họ muốn được chia quyền quản trị trong ban điều hành công ty","Họ biết, tin và muốn ủng hộ bạn, không phải vì ý tưởng xuất sắc","Họ thấy mô hình kinh doanh có triển vọng sinh lời vượt trội"],"a":2,"e":"Friends & family đầu tư vào con người: vì họ thích, tin và biết bạn, dù ý tưởng đôi khi chưa hợp lý với họ.","s":"Lecture 5 · Slide 14"},
{"d":2,"t":"mc","q":"Nhóm doanh nghiệp nào ngân hàng sẵn sàng cho vay nhất?","o":["Công ty ở giai đoạn Development đang xây dựng bản mẫu của sản phẩm","Công ty có mô hình kinh doanh liên tục thay đổi theo phản hồi thị trường","Dòng tiền dự đoán được, thu nhập ổn định, có tài sản thanh khoản","Startup công nghệ chưa có doanh thu nhưng đang tăng trưởng rất nhanh"],"a":2,"e":"Ngân hàng cho vay doanh nghiệp có dòng tiền dự đoán được và tài sản thanh khoản, thường là SME.","s":"Lecture 5 · Slide 19"},
{"d":2,"t":"mc","q":"Factoring và discounting là gì?","o":["Thuê thiết bị hoặc tài sản cố định từ công ty cho thuê dành riêng cho startup","Vay có khoản phải thu làm tài sản đảm bảo, hoặc bán khoản phải thu với giá thấp hơn","Khoản vay dành cho startup đã phát triển hơn và không có sẵn ở giai đoạn seed","Mua hàng từ nhà cung cấp trước và thanh toán sau theo điều khoản đã thỏa thuận"],"a":1,"e":"Discounting & Factoring dùng receivables để vay hoặc bán lấy tiền sớm. Các lựa chọn còn lại là venture leasing, trade credit, venture debt.","s":"Lecture 5 · Slide 21"},
{"d":2,"t":"mc","q":"Venture debt phù hợp nhất khi nào?","o":["Khi founder muốn tránh hoàn toàn nghĩa vụ hoàn trả nợ vay của mình","Khi công ty chưa có bất kỳ khách hàng hay doanh thu thực tế nào","Khi công ty chỉ mới có ý tưởng ở giai đoạn seed ban đầu của mình","Khi công ty đã lớn hơn và mô hình kinh doanh được chứng minh"],"a":3,"e":"Venture debt dành cho startup đã phát triển hơn, không có ở giai đoạn seed; phù hợp ở Rapid-Growth khi mô hình đã được chứng minh.","s":"Lecture 5 · Slide 21, 44"},
{"d":2,"t":"mc","q":"Điểm nào đúng về khoản đầu tư của VC?","o":["Không đòi hỏi quyền sở hữu và không tham gia hỗ trợ chiến lược","Là khoản vay có lãi suất cố định và lịch hoàn trả theo định kỳ","Kém thanh khoản, thường bị khóa 5-10 năm đến khi có thoái vốn","Có thể bán lại nhanh chóng trên thị trường thứ cấp công khai"],"a":2,"e":"VC: high risk/high reward, equity stake, active involvement, illiquid (5-10 năm đến liquidity event).","s":"Lecture 5 · Slide 24"},

   if(G.hintShown)return;
   G.hintShown=true;
   // tiny toast in the tools area
   const t=document.createElement('div');
   t.style.cssText='flex-basis:100%;color:var(--sky);font-size:16px;margin-top:4px';
   t.textContent='💡 Cô gợi ý: xem lại '+G.q.s;
   $('.qtools').appendChild(t);
 }
 G.h++;G.sc=Math.max(0,G.sc-(n==1?10:5));
 const s=$('.qscore');if(s)s.innerHTML=G.sc+'<small>điểm</small>';
 Snd.click();
}
function ans(k){
 if(!G||G.st!='ask')return;
 G.st='fb';
 const q=G.q,ok=k==G.c,rem=G.tl-(performance.now()-G.t0)/1000;
 G.tm.push(Math.min(G.tl,Math.max(0,G.tl-rem)));
 let pt=0,m=1;
 if(ok){
   G.ok++;G.cb++;G.mx=Math.max(G.mx,G.cb);
   m=G.cb>=5?3:G.cb>=3?2:1;
   const sp=rem>G.tl/2?5:0;if(sp)G.fast++;
   pt=([10,20,30,50][q.d-1]*(q.b?2:1)+sp)*m;
   G.sc+=pt;if(q.b)G.boss=1;
   mood='h';tm='h';Snd.ok();if(m>1)Snd.combo();
   burst(POS[sel][0],POS[sel][1]);
   pop('+'+pt+(m>1?'  COMBO x'+m:''),'g');
 } else {
   G.cb=0;mood='s';tm='s';Snd.no();sweat(POS[sel][0],POS[sel][1]);shake=8;
   pop(k<0?"TIME'S UP!":'NOT QUITE','r');
 }
 // visual state of options
 document.querySelectorAll('.qopt').forEach(b=>b.disabled=true);
 const okBtn=$('#o'+G.c);if(okBtn)okBtn.classList.add('ok');
 if(!ok&&k>=0){const noBtn=$('#o'+k);if(noBtn)noBtn.classList.add('no')}
 const s=$('.qscore');if(s)s.innerHTML=G.sc+'<small>điểm</small>';
 if(G.cb>=3){const cb=$('#combo');if(cb){cb.textContent='COMBO x'+(G.cb>=5?3:2);cb.classList.add('on')}}
 // avatar mood update
 drawHead($('#av'),ST[sel],mood);
 // Feedback overlay
 const fb=$('#fb');
 fb.innerHTML=`<div class="fbinner ${ok?'g':'r'}">
   <h3>${ok?'✓ CHÍNH XÁC! +'+pt:k<0?"⏱ TIME'S UP!":'✕ CHƯA ĐÚNG'}</h3>
   <p>👩‍🏫 <b>Cô giáo:</b> ${ok?['Giỏi lắm!','Chuẩn rồi, em nắm bài tốt!','Rất tốt, cứ thế phát huy!'][rnd(3)]:'Không sao, mình cùng xem lại nhé.'}</p>
   <p><b>Đáp án:</b> ${'ABCD'[G.c]}. ${G.o[G.c]}</p>
   <p>${q.e}</p>
   <small>📖 Nguồn: ${q.s}</small>
   <button class=next-btn onclick="G.i++;nxt()">${G.i+1>=G.qs.length?'Xem kết quả ▶':'Câu tiếp ▶'}</button>
 </div>`;
 fb.classList.add('on');
}
function fin(){
 G.st='end';sel=-1;tm='n';setPlaying(false);
 const n=G.qs.length,acc=Math.round(G.ok/n*100),st=acc>=90?3:acc>=70?2:acc>=40?1:0,d=Save.d,got=[];
 const lvBefore=levelInfo(d.xp).lv;
 if(G.sc>(d.best[G.k]||0))d.best[G.k]=G.sc;
 d.stars[G.k]=Math.max(d.stars[G.k]||0,st);
 d.xp+=G.sc;
 const lvAfter=levelInfo(d.xp).lv;
 const A=(id,c)=>{if(c&&!d.ach[id]){d.ach[id]=1;got.push(AC[id][0])}};
 A('first',1);A('perf',G.ok==n&&n>=5);A('cb',G.mx>=5);A('nh',!G.h&&n>=5);A('sp',G.fast>=3);A('boss',G.boss);
 A('lv5',lvAfter>=5);A('streak',d.streak>=3);
 Save.put();
 const avg=(G.tm.reduce((a,b)=>a+b,0)/n).toFixed(1);
 const lvUp=lvAfter>lvBefore;
 ui(`<div class=res>
   <h2>${lvUp?'🎉 LEVEL UP!':'CLASS RESULT'}</h2>
   ${lvUp?`<p style="color:var(--gold);font-family:'Press Start 2P',monospace;font-size:12px">LV ${lvBefore} → LV ${lvAfter}</p>`:''}
   <div class=big>${G.sc}</div><p style="margin-top:-6px">POINTS</p>
   <div class=stars>${'★'.repeat(st)+'☆'.repeat(3-st)}</div>
   <p>Đúng: ${G.ok}/${n} · Accuracy: ${acc}%</p>
   <p>Best combo: x${G.mx} · Trung bình ${avg}s/câu · XP: ${d.xp}</p>
   <h3>${acc>=90?'EXCELLENT!':acc>=70?'GOOD JOB!':'KEEP GOING!'}</h3>
   ${got.map(a=>`<p class=ac>★ Thành tích mới: ${a}</p>`).join('')}
   <div class=bt><button onclick="play('${G.k}')">Chơi lại</button><button onclick="chapters()">Chọn chương</button></div>
 </div>`);
 if(st>1){Snd.combo();for(let i=0;i<6;i++)setTimeout(()=>burst(rnd(200)+60,rnd(40)+120),i*180)}
 if(lvUp)Snd.levelup();
}
Save.load();menu();loop();
</script></body></html>
